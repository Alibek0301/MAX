<html lang="ru">

<head>

  <link rel="canonical" href="https://maxtaxi.kz/terms.html" />
  <link rel="alternate" href="https://maxtaxi.kz/terms.html?lang=ru" hreflang="ru" />
  <link rel="alternate" href="https://maxtaxi.kz/terms.html?lang=kk" hreflang="kk" />
  <link rel="alternate" href="https://maxtaxi.kz/terms.html?lang=en" hreflang="en" />
  <link rel="alternate" href="https://maxtaxi.kz/terms.html" hreflang="x-default" />
  <meta property="og:type" content="article" />

  <style>
    :root {
      --bg: #0f1318;
      --surface: #151c24;
      --text: #f0f3f7;
      --muted: rgba(240, 243, 247, 0.72);
      --accent: #f5c86a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Manrope, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(1100px 520px at 12% -8%, rgba(245, 200, 106, 0.14), transparent 60%),
        linear-gradient(180deg, #10161d 0%, #0c1117 52%, #0a0f14 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .lang {
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 8px;
    }

    .card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
    }

    h1 {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 30px;
      line-height: 1.2;
    }

    h2 {
      margin: 18px 0 8px;
      font-size: 16px;
      color: var(--accent);
    }

    p,
    li {
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    a {
      color: var(--accent);
    }

    .top-link {
      display: inline-block;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="toolbar">
      <a id="top-link" class="top-link" href="./">← На главную</a>
      <select id="lang-switch" class="lang" aria-label="Language switcher">
        <option value="ru">RU</option>
        <option value="kk">KK</option>
        <option value="en">EN</option>
      </select>
    </div>
    <section class="card">
      <h1 id="title"></h1>
      <p id="intro"></p>

      <h2 id="s1"></h2>
      <ul>
        <li id="s1li1"></li>
        <li id="s1li2"></li>
      </ul>

      <h2 id="s2"></h2>
      <ul>
        <li id="s2li1"></li>
        <li id="s2li2"></li>
      </ul>

      <h2 id="s3"></h2>
      <ul>
        <li id="s3li1"></li>
        <li id="s3li2"></li>
      </ul>

      <h2 id="s4"></h2>
      <ul>
        <li id="s4li1"></li>
        <li id="s4li2"></li>
      </ul>

      <h2 id="s5"></h2>
      <p id="s5p"></p>
    </section>
  </main>

        s5p: 'Использование сервиса MAX означает полное принятие положений настоящей оферты. Споры решаются в судах РК по месту нахождения ТОО "Vigil Agency".',
      },
      kk: {
        pageTitle: 'MAX - Қызмет көрсету шарттары',
        pageDescription: 'MAX қызмет көрсету шарттары',
        topLink: '← Басты бетке',
        title: 'Қызмет көрсету шарттары',
        intro: 'Осы Шарттар "Vigil Agency" ЖШС-нің (бұдан әрі — «Орындаушы») жария офертасы болып табылады және MAX сервисін пайдаланушыларға такси және трансфер қызметтерін көрсету тәртібін реттейді.',
        s1: '1. Шарттың мәні және брондау тәртібі',
        s1li1: 'Орындаушы веб-сайт немесе телефон арқылы ресімделген өтінімге сәйкес жолаушылар тасымалы бойынша қызмет көрсетуге міндеттенеді.',
        s1li2: 'Бронь менеджерден көлік пен жүргізуші туралы деректер көрсетілген кері байланыс алғаннан кейін ғана толық расталған болып саналады.',
        s2: '2. Тараптардың құқықтары мен міндеттері',
        s2li1: 'Орындаушы техникалық ақаусыз көлікті белгіленген уақытта беруге және сапардың кәсіби орындалуын қамтамасыз етуге міндетті.',
        s2li2: 'Тапсырыс беруші нақты байлыныс деректерін ұсынуға, қызметтерге уақытылы ақы төлеуге және көлік ішіндегі тәртіпті сақтауға міндетті.',
        s3: '3. Қаржылық шарттар және төлеу тәртібі',
        s3li1: 'Сайтта көрсетілген сапардың шамамен құны нақты маршрутқа немесе түнгі тарифке байланысты түзетілуі мүмкін.',
        s3li2: 'Төлем қолма-қол ақшамен, аударыммен немесе ұсынылған шот негізінде жүргізіледі.',
        s4: '4. Жауапкершілік, тапсырыстан бас тарту',
        s4li1: 'Тапсырыс беруші Орындаушыға кемінде 2 сағат бұрын хабарлай отырып, айыппұлсыз тапсырыстан бас тартуға құқылы.',
        s4li2: 'Орындаушы кенет көлік кептелісінен немесе ауа райының қолайсыздығынан туындаған жолдағы кешігулер үшін жауап бермейді.',
        s5: '5. Қорытынды ережелер',
        s5p: 'MAX сервисін пайдалану осы офертаның ережелерін толық қабылдауды білдіреді. Даулар "Vigil Agency" ЖШС орналасқан жері бойынша ҚР соттарында шешіледі.',
      },
      en: {
        pageTitle: 'MAX - Terms of Service',
        pageDescription: 'MAX terms of service',
        topLink: '← Back to home',
        title: 'Terms of Service',
        intro: 'These Terms constitute a public offer of "Vigil Agency" LLP (hereinafter — the "Contractor") and regulate the procedure for providing taxi and transfer services to the users of the MAX service.',
        s1: '1. Subject of the Agreement and Booking Procedure',
        s1li1: 'The Contractor undertakes to provide passenger transportation services according to the request submitted via the website or by phone.',
        s1li2: 'A booking is considered fully confirmed only after receiving feedback from a manager, including vehicle and driver details.',
        s2: '2. Rights and Responsibilities',
        s2li1: 'The Contractor undertakes to provide a technically sound vehicle of the agreed class exactly at the scheduled time.',
        s2li2: 'The Customer undertakes to provide accurate contact information, pay in a timely manner, and observe the rules of conduct inside the vehicle.',
        s3: '3. Financial Terms and Payment Procedure',
        s3li1: 'The estimated trip cost displayed on the website may be adjusted depending on the actual route or night rates.',
        s3li2: 'Payment is made in cash, by bank transfer, or based on an invoice (for legal entities).',
        s4: '4. Liability and Order Cancellation',
        s4li1: 'The Customer has the right to cancel an order without penalty by notifying the Contractor no later than 2 hours in advance.',
        s4li2: 'The Contractor is not liable for delays en route caused by sudden traffic jams or adverse weather conditions.',
        s5: '5. Final Provisions',
        s5p: 'Using the MAX service constitutes full acceptance of the provisions of this offer. Disputes are resolved in the courts of the Republic of Kazakhstan at the location of "Vigil Agency" LLP.',
      },
    }

    const allowed = ['ru', 'kk', 'en']
    const params = new URLSearchParams(window.location.search)
    const fromQuery = params.get('lang')
    const fromStorage = localStorage.getItem('language')
    const fromNavigator = navigator.language ? navigator.language.slice(0, 2).toLowerCase() : 'ru'
    const initialLanguage = allowed.includes(fromQuery) ? fromQuery : (allowed.includes(fromStorage) ? fromStorage : (allowed.includes(fromNavigator) ? fromNavigator : 'ru'))

    const applyLanguage = (language) => {
      const lang = allowed.includes(language) ? language : 'ru'
      const t = i18n[lang]

      document.documentElement.lang = lang
      document.title = t.pageTitle
      document.querySelector('meta[name="description"]').setAttribute('content', t.pageDescription)
      document.getElementById('lang-switch').value = lang
      document.getElementById('top-link').textContent = t.topLink
      document.getElementById('top-link').href = `./?lang=${lang}`

      Object.keys(t).forEach((key) => {
        if (['pageTitle', 'pageDescription', 'topLink'].includes(key)) return
        const node = document.getElementById(key)
        if (node) node.textContent = t[key]
      })

      localStorage.setItem('language', lang)
      params.set('lang', lang)
      history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`)
    }

    document.getElementById('lang-switch').addEventListener('change', (event) => {
      applyLanguage(event.target.value)
    })

    applyLanguage(initialLanguage)
  </script>
</body>

</html>
